<!--
	"My Collection" page template.

	Regular WP Page — the query loop below is non-inheriting so the Page's
	own main query (post_type=page) doesn't control what's listed. Scoping to
	the current user's saved lagoons is done server-side in
	CollectionQueryFilter via pre_get_posts, which also honours the same
	?language=&search=&date_range= grammar the lagoon archive uses, so the
	filter bar works the same way here.
-->
<!-- wp:template-part {"slug":"header","tagName":"header"} /-->

<!-- wp:group {"tagName":"main","align":"full","className":"codelag-archive codelag-collection-page","style":{"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|70","left":"20px","right":"20px"},"blockGap":"1.25rem"}},"layout":{"type":"constrained","contentSize":"100%","wideSize":"100%"}} -->
<main class="wp-block-group alignfull codelag-archive codelag-collection-page" style="padding-top:var(--wp--preset--spacing--40);padding-right:20px;padding-bottom:var(--wp--preset--spacing--70);padding-left:20px">

	<!-- wp:group {"className":"codelag-archive__hero","layout":{"type":"default"}} -->
	<div class="wp-block-group codelag-archive__hero">

	</div>
	<!-- /wp:group -->

	<!-- wp:codelag/lagoon-filters /-->

</main>
